project: Emulator Config
input:
  format: elf
  path: ./firmware/firmware.elf  # bare-metal AArch64 ELF (not Linux), see firmware/build.sh
    
mem_map:
  - from: 0x40000000   # flash / code
    size: 0x10000000
    flags: RWX

  - from: 0x50000000   # SRAM
    size: 0x10000000
    flags: RWX

  - from: 0x60000000   # peripherals
    size: 0x10000000
    flags: RW

registers:
  - name: 'SP'
    value: 0x5ffff000

# boot:
#   begin: 0x80003d10
#   until: 0x80003f2a
#   timout: 0x00
#   count: 0x00

init_script: ./plugins/example/target/wasm32-wasip1/release/example.wasm
sleigh_path: ../rust-sleigh/vendor/share/sleigh/specfiles/Ghidra/Processors